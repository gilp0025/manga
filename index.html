<!-- Setup Modal -->
<div class="modal-overlay" id="setupModal">
  <div class="modal">
    <div class="modal-header">
      <h2>GitHub Setup</h2>
      <button class="modal-close" onclick="closeSetupModal()" id="setupCloseBtn" style="display:none">&times;</button>
    </div>
    <div class="modal-body">
      <p style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:1rem;">
        Your library is stored in a GitHub repository. You need a
        <a href="https://github.com/settings/tokens/new" target="_blank" rel="noopener" style="color:var(--accent);">personal access token</a>
        with <strong>repo</strong> scope.
      </p>
      <div class="form-group">
        <label class="form-label">GitHub Username</label>
        <input type="text" class="form-input" id="ghUser" placeholder="e.g. yourname">
      </div>
      <div class="form-group">
        <label class="form-label">Repository Name</label>
        <input type="text" class="form-input" id="ghRepo" placeholder="e.g. manga-library">
      </div>
      <div class="form-group">
        <label class="form-label">Personal Access Token</label>
        <input type="password" class="form-input" id="ghToken" placeholder="ghp_...">
      </div>
      <div id="setupError" style="color:var(--accent);font-size:0.8rem;margin-top:0.5rem;display:none;"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="saveSetup()">Connect</button>
    </div>
  </div>
</div>

<!-- Auto-populate progress -->
<div class="autopop-overlay" id="autopopOverlay">
  <div class="autopop-box">
    <h3 id="autopopTitle">Fetching manga data…</h3>
    <div class="autopop-status" id="autopopStatus">Preparing…</div>
    <div class="autopop-bar-bg"><div class="autopop-bar" id="autopopBar"></div></div>
    <div class="autopop-counts">
      <span id="autopopProgress">0 / 0</span>
      <span id="autopopFound">0 found</span>
    </div>
    <div class="autopop-actions">
      <button class="btn btn-secondary" id="autopopStopBtn" onclick="stopAutoPopulate()">Stop</button>
      <button class="btn btn-primary" id="autopopDoneBtn" onclick="closeAutoPopulate()" style="display:none;">Done</button>
    </div>
  </div>
</div>

<div id="saveIndicator"></div>

<script>
// ── State ──
let ghConfig = null;
let fileSha = null;
let manga = [];
let currentReadingFilter = 'all';
let currentDemographic = null;
let currentGenre = null;
let currentTag = null;
let currentPubStatus = null;
let currentRepFilter = null; // 'lgbtq', 'disability', or a specific sub like 'lgbtq:gay'
let editingId = null;
let viewingId = null;
let currentGenres = [];
let currentTags = [];
let currentThemes = [];
let currentRating = 0;
let saveTimeout = null;
let tagManagerType = 'tags'; // 'tags', 'genres', or 'themes'
let currentAlphaFilter = null;
let currentThemeFilter = null;
let bulkMode = false;
let bulkSelected = new Set();
let currentRatingFilter = null;
let sidebarCollapsed = { demographic: false, representation: false, genre: false, themes: false, tags: false, rating: false };

// ── GitHub Storage ──
function loadConfig() {
  try {
    const raw = localStorage.getItem('manga-library-gh');
    if (raw) { ghConfig = JSON.parse(raw); return true; }
  } catch(e) {}
  return false;
}

function saveConfig() { localStorage.setItem('manga-library-gh', JSON.stringify(ghConfig)); }

function openSetupModal() {
  if (ghConfig) {
    document.getElementById('ghUser').value = ghConfig.user || '';
    document.getElementById('ghRepo').value = ghConfig.repo || '';
    document.getElementById('ghToken').value = ghConfig.token || '';
    document.getElementById('setupCloseBtn').style.display = '';
  } else {
    document.getElementById('ghUser').value = '';
    document.getElementById('ghRepo').value = '';
    document.getElementById('ghToken').value = '';
    document.getElementById('setupCloseBtn').style.display = 'none';
  }
  document.getElementById('setupError').style.display = 'none';
  document.getElementById('setupModal').classList.add('open');
}

function closeSetupModal() { document.getElementById('setupModal').classList.remove('open'); }

async function saveSetup() {
  const user = document.getElementById('ghUser').value.trim();
  const repo = document.getElementById('ghRepo').value.trim();
  const token = document.getElementById('ghToken').value.trim();
  const errEl = document.getElementById('setupError');
  if (!user || !repo || !token) { errEl.textContent = 'All fields required.'; errEl.style.display = 'block'; return; }
  errEl.style.display = 'none';
  ghConfig = { user, repo, token };
  try {
    await loadFromGitHub();
    saveConfig(); closeSetupModal(); renderManga();
  } catch(e) {
    if (e.message === 'NOT_FOUND') {
      try { await saveToGitHub(); saveConfig(); closeSetupModal(); renderManga(); }
      catch(e2) { errEl.textContent = 'Could not create library file. Check token and repo.'; errEl.style.display = 'block'; ghConfig = null; }
    } else { errEl.textContent = e.message || 'Connection failed.'; errEl.style.display = 'block'; ghConfig = null; }
  }
}

async function loadFromGitHub() {
  const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/library.json`;
  const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json' } });
  if (res.status === 404) throw new Error('NOT_FOUND');
  if (res.status === 401 || res.status === 403) throw new Error('Authentication failed.');
  if (!res.ok) throw new Error(`GitHub returned ${res.status}`);
  const data = await res.json();
  fileSha = data.sha;
  const content = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
  manga = JSON.parse(content);
  // Normalize legacy field names
  manga.forEach(m => {
    if (m.publicationStatus) {
      if (!m.pubStatus || m.pubStatus === 'unknown') m.pubStatus = m.publicationStatus;
      delete m.publicationStatus;
    }
    if (!m.pubStatus) m.pubStatus = 'unknown';
    // Normalize demographic spelling
    if (m.demographic === 'shonen') m.demographic = 'shounen';
    if (m.demographic === 'shojo') m.demographic = 'shoujo';
  });
}

async function saveToGitHub() {
  if (!ghConfig) return;
  const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/library.json`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(manga, null, 2))));
  const body = { message: `Update library (${new Date().toISOString().split('T')[0]})`, content };
  if (fileSha) body.sha = fileSha;
  const res = await fetch(url, { method: 'PUT', headers: { 'Authorization': `Bearer ${ghConfig.token}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.message || `Save failed (${res.status})`); }
  const data = await res.json();
  fileSha = data.content.sha;
}

function save() {
  showIndicator('saving…');
  if (saveTimeout) clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    try { await saveToGitHub(); showIndicator('saved'); setTimeout(hideIndicator, 1500); }
    catch(e) {
      showIndicator('save failed — retrying…');
      setTimeout(async () => {
        try { await loadFromGitHub(); await saveToGitHub(); showIndicator('saved'); setTimeout(hideIndicator, 1500); }
        catch(e2) { showIndicator('save failed — use export as backup'); }
      }, 5000);
    }
  }, 2000);
}

function showIndicator(t) { const e = document.getElementById('saveIndicator'); e.textContent = t; e.style.display = 'block'; }
function hideIndicator() { document.getElementById('saveIndicator').style.display = 'none'; }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

// ── AniList Lookup ──
async function lookupManga() {
  const query = document.getElementById('lookupQuery').value.trim();
  if (!query) return;
  const btn = document.getElementById('lookupBtn');
  btn.disabled = true; btn.textContent = 'searching…';
  const resultsDiv = document.getElementById('lookupResults');
  resultsDiv.innerHTML = '';

  const gql = `query ($search: String) {
    Page(page: 1, perPage: 6) {
      media(search: $search, type: MANGA, sort: [SEARCH_MATCH, POPULARITY_DESC]) {
        id
        title { romaji english }
        coverImage { large medium }
        description(asHtml: false)
        staff(sort: RELEVANCE, perPage: 3) { edges { role node { name { full } } } }
        genres
        volumes
        chapters
        status
        format
        countryOfOrigin
        tags { name category rank isMediaSpoiler }
      }
    }
  }`;

  try {
    const res = await fetch('https://graphql.anilist.co', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query: gql, variables: { search: query } })
    });
    const json = await res.json();
    const results = json.data?.Page?.media || [];

    if (results.length === 0) {
      resultsDiv.innerHTML = '<div style="color:var(--text-tertiary);font-size:0.8rem;padding:0.4rem;">No results found.</div>';
      return;
    }

    window._lookupResults = results.map(m => {
      const authors = (m.staff?.edges || [])
        .filter(e => e.role && (e.role.toLowerCase().includes('story') || e.role.toLowerCase().includes('art') || e.role.toLowerCase().includes('original')))
        .map(e => e.node.name.full);
      const uniqueAuthors = [...new Set(authors)];

      // Map AniList status to our status
      let pubStatus = 'unknown';
      if (m.status === 'FINISHED') pubStatus = 'finished';
      else if (m.status === 'RELEASING') pubStatus = 'ongoing';
      else if (m.status === 'HIATUS') pubStatus = 'hiatus';
      else if (m.status === 'CANCELLED') pubStatus = 'cancelled';
      else if (m.status === 'NOT_YET_RELEASED') pubStatus = 'ongoing';

      // Extract demographic from AniList tags (category: "Demographic")
      let demographic = '';
      const demoTag = (m.tags || []).find(t => (t.category || '').toLowerCase() === 'demographic' && !t.isMediaSpoiler);
      if (demoTag) {
        demographic = demoTag.name.toLowerCase();
        if (demographic === 'shonen') demographic = 'shounen';
        if (demographic === 'shojo') demographic = 'shoujo';
      }

      // Clean synopsis (remove HTML tags)
      let synopsis = (m.description || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim();
      if (synopsis.length > 400) synopsis = synopsis.slice(0, 397) + '…';

      return {
        title: m.title.english || m.title.romaji || '',
        titleRomaji: m.title.romaji || '',
        authors: uniqueAuthors.length ? uniqueAuthors : ['Unknown'],
        cover: m.coverImage?.large || m.coverImage?.medium || '',
        synopsis,
        genres: (m.genres || []).map(g => g.toLowerCase()),
        volumes: m.volumes || null,
        chapters: m.chapters || null,
        pubStatus,
        demographic,
        format: m.format
      };
    });

    resultsDiv.innerHTML = window._lookupResults.map((r, i) => {
      const subtitle = r.authors.join(', ') + (r.volumes ? ` · ${r.volumes} vol` : '') + (r.chapters ? ` · ${r.chapters} ch` : '') + (r.pubStatus !== 'unknown' ? ` · ${r.pubStatus}` : '');
      return `<div class="lookup-result" onclick="selectLookup(${i})">
        ${r.cover ? `<img src="${escHtml(r.cover)}" alt="">` : ''}
        <div class="lookup-result-info">
          <div class="lookup-result-title">${escHtml(r.title)}</div>
          <div class="lookup-result-meta">${escHtml(subtitle)}</div>
        </div>
      </div>`;
    }).join('');
  } catch(err) {
    resultsDiv.innerHTML = '<div style="color:var(--accent);font-size:0.8rem;padding:0.4rem;">Search failed. Check your connection.</div>';
  } finally {
    btn.textContent = 'wait…';
    setTimeout(() => { btn.disabled = false; btn.textContent = 'search'; }, 1500);
  }
}

function selectLookup(i) {
  const item = window._lookupResults?.[i];
  if (!item) return;
  document.getElementById('mangaTitle').value = item.title;
  document.getElementById('mangaAuthor').value = item.authors.join(', ');
  document.getElementById('mangaCover').value = item.cover;
  document.getElementById('mangaSynopsis').value = item.synopsis;
  document.getElementById('mangaVolumes').value = item.volumes || '';
  document.getElementById('mangaChapters').value = item.chapters || '';
  document.getElementById('mangaPubStatus').value = item.pubStatus;
  if (item.demographic) document.getElementById('mangaDemographic').value = item.demographic;

  // Fill genres
  item.genres.forEach(g => { if (!currentGenres.includes(g)) currentGenres.push(g); });
  renderTagChips('genres');

  document.getElementById('lookupResults').innerHTML = '';
  document.getElementById('lookupQuery').value = '';
}

// ── Render ──
function starsHtml(rating, size) {
  let h = '';
  for (let i = 1; i <= 5; i++) h += `<span class="star${i <= rating ? ' filled' : ''}" style="font-size:${size};">★</span>`;
  return h;
}

function clickableStarsHtml(id, rating) {
  let h = '<div class="card-rating">';
  for (let i = 1; i <= 5; i++) {
    h += `<button class="star-click${i <= rating ? ' filled' : ''}" onclick="event.stopPropagation();quickRate('${id}',${i})" title="${i} star${i > 1 ? 's' : ''}">★</button>`;
  }
  h += '</div>';
  return h;
}

function quickRate(id, rating) {
  const m = manga.find(x => x.id === id);
  if (!m) return;
  m.rating = m.rating === rating ? 0 : rating;
  save();
  renderManga();
  if (viewingId === id) openDetail(id);
}

function renderManga() {
  const query = document.getElementById('searchBox').value.toLowerCase().trim();
  const grid = document.getElementById('mangaGrid');

  let filtered = manga.filter(m => {
    if (currentReadingFilter !== 'all' && m.readingStatus !== currentReadingFilter) return false;
    if (currentDemographic && m.demographic !== currentDemographic) return false;
    if (currentGenre && !(m.genres || []).includes(currentGenre)) return false;
    if (currentTag && !(m.tags || []).includes(currentTag)) return false;
    if (currentThemeFilter && !(m.themes || []).includes(currentThemeFilter)) return false;
    if (currentPubStatus && m.pubStatus !== currentPubStatus) return false;
    if (currentRatingFilter && (m.rating || 0) !== currentRatingFilter) return false;
    if (currentAlphaFilter) {
      const firstChar = (m.title || '')[0]?.toUpperCase();
      if (currentAlphaFilter === '#') {
        if (firstChar && firstChar >= 'A' && firstChar <= 'Z') return false;
      } else if (firstChar !== currentAlphaFilter) return false;
    }
    if (currentRepFilter) {
      if (currentRepFilter === 'lgbtq' && (!m.lgbtq || !m.lgbtq.length)) return false;
      if (currentRepFilter === 'disability' && (!m.disability || !m.disability.length)) return false;
      if (currentRepFilter.startsWith('lgbtq:') && (!m.lgbtq || !m.lgbtq.includes(currentRepFilter.split(':')[1]))) return false;
      if (currentRepFilter.startsWith('disability:') && (!m.disability || !m.disability.includes(currentRepFilter.split(':')[1]))) return false;
    }
    if (query) {
      const searchable = [m.title, m.author, ...(m.genres || []), ...(m.tags || []), ...(m.themes || []), m.demographic || '', ...(m.lgbtq || []), ...(m.disability || [])].join(' ').toLowerCase();
      return searchable.includes(query);
    }
    return true;
  });

  const sortMode = document.getElementById('sortOrder').value;
  if (sortMode === 'rating') {
    filtered.sort((a, b) => {
      const r = (b.rating || 0) - (a.rating || 0);
      if (r !== 0) return r;
      return (a.title || '').localeCompare(b.title || '');
    });
  } else if (sortMode === 'status') {
    const order = { reading: 0, 'not-read': 1, read: 2, dropped: 3 };
    filtered.sort((a, b) => {
      const s = (order[a.readingStatus] || 9) - (order[b.readingStatus] || 9);
      if (s !== 0) return s;
      return (a.title || '').localeCompare(b.title || '');
    });
  } else {
    filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
  }

  document.getElementById('mangaCount').textContent = manga.length === 0 ? '' : `${manga.length} titles`;
  renderSidebar();
  renderAlphaBar();

  if (filtered.length === 0) {
    grid.innerHTML = manga.length === 0
      ? '<div class="empty-state"><h2>Your library is empty</h2><p>Add your first manga to get started.</p></div>'
      : '<div class="empty-state"><p>No manga match your filters.</p></div>';
    return;
  }

  grid.innerHTML = filtered.map(m => {
    const coverHtml = m.cover
      ? `<img src="${escHtml(m.cover)}" alt="" loading="lazy">`
      : `<div class="manga-cover-placeholder">${(m.title || '?')[0]}</div>`;

    // Demographic line
    const demoLine = m.demographic ? `<div class="manga-info-line"><span class="info-label">Demographic:</span> ${escHtml(m.demographic)}</div>` : '';

    // Volume/Chapter line
    const countParts = [];
    if (m.volumes) countParts.push(escHtml(m.volumes) + ' vol');
    if (m.chapters) countParts.push(escHtml(m.chapters) + ' ch');
    const countLine = countParts.length ? `<div class="manga-info-line"><span class="info-label">Volumes:</span> ${countParts.join(' · ')}</div>` : '';

    // Genres as text with label
    const genreText = (m.genres || []).length ? `<div class="manga-info-line"><span class="info-label">Genre:</span> ${(m.genres || []).slice(0, 4).map(g => escHtml(g)).join(', ')}</div>` : '';

    // Representation as text with label
    const repParts = [];
    if (m.lgbtq && m.lgbtq.length) repParts.push(...m.lgbtq.map(v => escHtml(v)));
    if (m.disability && m.disability.length) repParts.push(...m.disability.map(v => escHtml(v)));
    const repLine = repParts.length ? `<div class="manga-info-line"><span class="info-label">Representation:</span> ${repParts.join(', ')}</div>` : '';

    // Theme line
    const themeLine = (m.themes || []).length ? `<div class="manga-info-line"><span class="info-label">Theme:</span> ${(m.themes || []).map(t => escHtml(t)).join(', ')}</div>` : '';

    // Synopsis preview (2 lines truncated)
    const synopsisPreview = m.synopsis ? `<div class="manga-synopsis-preview">${escHtml(m.synopsis)}</div>` : '';

    // Clickable rating stars
    const cardRating = clickableStarsHtml(m.id, m.rating || 0);

    // Status dropdown with color class
    const stClass = 'st-' + (m.readingStatus || 'not-read');
    const statusOptions = [
      { val: 'not-read', label: 'Not Read' },
      { val: 'reading', label: 'Reading' },
      { val: 'read', label: 'Read' },
      { val: 'dropped', label: 'Dropped' }
    ];
    const dropdownHtml = `<select class="status-dropdown ${stClass}" onclick="event.stopPropagation()" onchange="event.stopPropagation();quickStatus('${m.id}',this.value)">${statusOptions.map(o => `<option value="${o.val}"${m.readingStatus === o.val ? ' selected' : ''}>${o.label}</option>`).join('')}</select>`;

    const bulkClass = bulkMode ? ' bulk-mode' + (bulkSelected.has(m.id) ? ' bulk-selected' : '') : '';
    const cardClick = bulkMode ? `toggleBulkSelect('${m.id}')` : `openDetail('${m.id}')`;
    const bulkCheckHtml = bulkMode ? '<div class="bulk-check">✓</div>' : '';

    return `<div class="manga-card${bulkClass}" onclick="${cardClick}">
      ${bulkCheckHtml}
      <div class="manga-card-left">
        <div class="manga-cover-wrap">
          ${coverHtml}
        </div>
        ${cardRating}
      </div>
      <div class="manga-info">
        <div class="manga-title">${escHtml(m.title || 'Untitled')}</div>
        <div class="manga-author">${escHtml(m.author || '')}</div>
        ${synopsisPreview}
        ${demoLine}
        ${countLine}
        ${genreText}
        ${themeLine}
        ${repLine}
        <div class="manga-card-footer">
          ${dropdownHtml}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Sidebar ──
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '';

  // Reading status counts
  const readCounts = { all: manga.length, reading: 0, 'not-read': 0, read: 0, dropped: 0 };
  manga.forEach(m => { if (readCounts.hasOwnProperty(m.readingStatus)) readCounts[m.readingStatus]++; });
  const readLabels = { all: 'All', reading: 'Reading', 'not-read': 'Not Read', read: 'Read', dropped: 'Dropped' };

  html += '<div class="sidebar-section"><div class="sidebar-heading">Shelves</div>';
  for (const [key, label] of Object.entries(readLabels)) {
    const active = currentReadingFilter === key && !currentDemographic && !currentGenre && !currentTag && !currentPubStatus && !currentRepFilter && !currentThemeFilter && !currentAlphaFilter && !currentRatingFilter ? ' active' : '';
    html += `<div class="sidebar-item${active}" onclick="clearFilters();setReadingFilter('${key}')"><span class="sidebar-item-name">${label}</span><span class="sidebar-item-count">${readCounts[key]}</span></div>`;
  }
  html += '</div>';

  // Publication status counts
  const pubCounts = {};
  manga.forEach(m => { const s = m.pubStatus || 'unknown'; pubCounts[s] = (pubCounts[s] || 0) + 1; });
  const pubLabels = { ongoing: 'Ongoing', finished: 'Finished', hiatus: 'Hiatus', cancelled: 'Cancelled', unknown: 'Unknown' };
  const pubKeys = Object.keys(pubLabels).filter(k => pubCounts[k]);

  if (pubKeys.length > 0) {
    html += '<div class="sidebar-section"><div class="sidebar-heading">Publication</div>';
    pubKeys.forEach(key => {
      const active = currentPubStatus === key ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="togglePubStatus('${key}')"><span class="sidebar-item-name">${pubLabels[key]}</span><span class="sidebar-item-count">${pubCounts[key]}</span></div>`;
    });
    html += '</div>';
  }

  // Demographic counts
  const demCounts = {};
  manga.forEach(m => { if (m.demographic) demCounts[m.demographic] = (demCounts[m.demographic] || 0) + 1; });
  const demOrder = ['shounen', 'shoujo', 'seinen', 'josei'];
  const demLabels = { shounen: 'Shounen', shoujo: 'Shoujo', seinen: 'Seinen', josei: 'Josei' };
  const demKeys = demOrder.filter(k => demCounts[k]);

  if (demKeys.length > 0) {
    const demCollapsed = sidebarCollapsed.demographic;
    html += '<div class="sidebar-section"><div class="sidebar-heading collapsible' + (demCollapsed ? ' collapsed' : '') + '" onclick="toggleSidebarCollapse(\'demographic\')"><span>Demographic</span><div style="display:flex;align-items:center;"><span class="collapse-chevron">›</span></div></div>';
    html += '<div class="sidebar-section-items' + (demCollapsed ? ' collapsed' : '') + '">';
    demKeys.forEach(key => {
      const active = currentDemographic === key ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="toggleDemographic('${key}')"><span class="sidebar-item-name">${demLabels[key]}</span><span class="sidebar-item-count">${demCounts[key]}</span></div>`;
    });
    html += '</div></div>';
  }

  // Rating filter
  const ratingCounts = { 5: 0, 4: 0, 3: 0, 2: 0, 1: 0 };
  manga.forEach(m => { const r = m.rating || 0; if (r >= 1 && r <= 5) ratingCounts[r]++; });
  const hasRatings = Object.values(ratingCounts).some(c => c > 0);

  if (hasRatings) {
    const ratCollapsed = sidebarCollapsed.rating;
    html += '<div class="sidebar-section"><div class="sidebar-heading collapsible' + (ratCollapsed ? ' collapsed' : '') + '" onclick="toggleSidebarCollapse(\'rating\')"><span>Rating</span><span class="collapse-chevron">›</span></div>';
    html += '<div class="sidebar-section-items' + (ratCollapsed ? ' collapsed' : '') + '">';
    for (let r = 5; r >= 1; r--) {
      if (ratingCounts[r] > 0) {
        const active = currentRatingFilter === r ? ' active' : '';
        const stars = '★'.repeat(r) + '☆'.repeat(5 - r);
        html += `<div class="sidebar-item${active}" onclick="toggleRatingFilter(${r})"><span class="sidebar-item-name" style="letter-spacing:1px;color:var(--amber);">${stars}</span><span class="sidebar-item-count">${ratingCounts[r]}</span></div>`;
      }
    }
    html += '</div></div>';
  }

  // Genre counts (collapsible)
  const genreCounts = {};
  manga.forEach(m => { (m.genres || []).forEach(g => { genreCounts[g] = (genreCounts[g] || 0) + 1; }); });
  const sortedGenres = Object.keys(genreCounts).sort((a, b) => a.localeCompare(b));

  if (sortedGenres.length > 0) {
    const genCollapsed = sidebarCollapsed.genre;
    html += '<div class="sidebar-section"><div class="sidebar-heading collapsible' + (genCollapsed ? ' collapsed' : '') + '" onclick="toggleSidebarCollapse(\'genre\')"><span>Genres</span><div style="display:flex;align-items:center;gap:0.5rem;"><span class="sidebar-edit" onclick="event.stopPropagation();openTagManager(\'genres\')">edit</span><span class="collapse-chevron">›</span></div></div>';
    html += '<div class="sidebar-section-items' + (genCollapsed ? ' collapsed' : '') + '">';
    sortedGenres.forEach(g => {
      const active = currentGenre === g ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="toggleGenre('${g.replace(/'/g, "\\'")}')"><span class="sidebar-item-name">${escHtml(g)}</span><span class="sidebar-item-count">${genreCounts[g]}</span></div>`;
    });
    html += '</div></div>';
  }

  // Theme counts (collapsible)
  const themeCounts = {};
  manga.forEach(m => { (m.themes || []).forEach(t => { themeCounts[t] = (themeCounts[t] || 0) + 1; }); });
  const sortedThemes = Object.keys(themeCounts).sort((a, b) => a.localeCompare(b));

  if (sortedThemes.length > 0) {
    const thCollapsed = sidebarCollapsed.themes;
    html += '<div class="sidebar-section"><div class="sidebar-heading collapsible' + (thCollapsed ? ' collapsed' : '') + '" onclick="toggleSidebarCollapse(\'themes\')"><span>Themes</span><div style="display:flex;align-items:center;gap:0.5rem;"><span class="sidebar-edit" onclick="event.stopPropagation();openTagManager(\'themes\')">edit</span><span class="collapse-chevron">›</span></div></div>';
    html += '<div class="sidebar-section-items' + (thCollapsed ? ' collapsed' : '') + '">';
    sortedThemes.forEach(t => {
      const active = currentThemeFilter === t ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="toggleTheme('${t.replace(/'/g, "\\'")}')"><span class="sidebar-item-name">${escHtml(t)}</span><span class="sidebar-item-count">${themeCounts[t]}</span></div>`;
    });
    html += '</div></div>';
  }

  // Tag counts (collapsible)
  const tagCounts = {};
  manga.forEach(m => { (m.tags || []).forEach(t => { tagCounts[t] = (tagCounts[t] || 0) + 1; }); });
  const sortedTags = Object.keys(tagCounts).sort((a, b) => a.localeCompare(b));

  if (sortedTags.length > 0) {
    const tagCollapsed = sidebarCollapsed.tags;
    html += '<div class="sidebar-section"><div class="sidebar-heading collapsible' + (tagCollapsed ? ' collapsed' : '') + '" onclick="toggleSidebarCollapse(\'tags\')"><span>Tags</span><div style="display:flex;align-items:center;gap:0.5rem;"><span class="sidebar-edit" onclick="event.stopPropagation();openTagManager(\'tags\')">edit</span><span class="collapse-chevron">›</span></div></div>';
    html += '<div class="sidebar-section-items' + (tagCollapsed ? ' collapsed' : '') + '">';
    sortedTags.forEach(t => {
      const active = currentTag === t ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="toggleTag('${t.replace(/'/g, "\\'")}')"><span class="sidebar-item-name">${escHtml(t)}</span><span class="sidebar-item-count">${tagCounts[t]}</span></div>`;
    });
    html += '</div></div>';
  }

  // Representation section (collapsible)
  const lgbtqCount = manga.filter(m => m.lgbtq && m.lgbtq.length).length;
  const disabilityCount = manga.filter(m => m.disability && m.disability.length).length;

  if (lgbtqCount > 0 || disabilityCount > 0) {
    const repCollapsed = sidebarCollapsed.representation;
    html += '<div class="sidebar-section"><div class="sidebar-heading collapsible' + (repCollapsed ? ' collapsed' : '') + '" onclick="toggleSidebarCollapse(\'representation\')"><span>Representation</span><span class="collapse-chevron">›</span></div>';
    html += '<div class="sidebar-section-items' + (repCollapsed ? ' collapsed' : '') + '">';
    if (lgbtqCount > 0) {
      const active = currentRepFilter === 'lgbtq' ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="toggleRep('lgbtq')"><span class="sidebar-item-name">LGBTQ+</span><span class="sidebar-item-count">${lgbtqCount}</span></div>`;
      const lgbtqSubs = {};
      manga.forEach(m => { (m.lgbtq || []).forEach(v => { lgbtqSubs[v] = (lgbtqSubs[v] || 0) + 1; }); });
      Object.keys(lgbtqSubs).sort().forEach(sub => {
        const subActive = currentRepFilter === 'lgbtq:' + sub ? ' active' : '';
        html += `<div class="sidebar-item sidebar-sub${subActive}" onclick="toggleRep('lgbtq:${sub}')" style="padding-left:2rem;font-size:0.8rem;"><span class="sidebar-item-name">${escHtml(sub)}</span><span class="sidebar-item-count">${lgbtqSubs[sub]}</span></div>`;
      });
    }
    if (disabilityCount > 0) {
      const active = currentRepFilter === 'disability' ? ' active' : '';
      html += `<div class="sidebar-item${active}" onclick="toggleRep('disability')"><span class="sidebar-item-name">Disability</span><span class="sidebar-item-count">${disabilityCount}</span></div>`;
      const disSubs = {};
      manga.forEach(m => { (m.disability || []).forEach(v => { disSubs[v] = (disSubs[v] || 0) + 1; }); });
      Object.keys(disSubs).sort().forEach(sub => {
        const subActive = currentRepFilter === 'disability:' + sub ? ' active' : '';
        html += `<div class="sidebar-item sidebar-sub${subActive}" onclick="toggleRep('disability:${sub}')" style="padding-left:2rem;font-size:0.8rem;"><span class="sidebar-item-name">${escHtml(sub)}</span><span class="sidebar-item-count">${disSubs[sub]}</span></div>`;
      });
    }
    html += '</div></div>';
  }

  sb.innerHTML = html;
}

// ── Filters ──
function clearFilters() { currentDemographic = null; currentGenre = null; currentTag = null; currentPubStatus = null; currentRepFilter = null; currentThemeFilter = null; currentAlphaFilter = null; currentRatingFilter = null; }

function setReadingFilter(v) {
  currentReadingFilter = v;
  document.getElementById('readingFilter').value = v;
  renderManga();
}

function toggleDemographic(d) { currentDemographic = currentDemographic === d ? null : d; renderManga(); }
function toggleGenre(g) { currentGenre = currentGenre === g ? null : g; renderManga(); }
function toggleTag(t) { currentTag = currentTag === t ? null : t; renderManga(); }
function toggleRep(r) { currentRepFilter = currentRepFilter === r ? null : r; renderManga(); }
function togglePubStatus(s) { currentPubStatus = currentPubStatus === s ? null : s; renderManga(); }
function toggleTheme(t) { currentThemeFilter = currentThemeFilter === t ? null : t; renderManga(); }
function toggleAlpha(letter) { currentAlphaFilter = currentAlphaFilter === letter ? null : letter; renderManga(); }
function toggleRatingFilter(n) { currentRatingFilter = currentRatingFilter === n ? null : n; renderManga(); }
function toggleSidebarCollapse(section) { sidebarCollapsed[section] = !sidebarCollapsed[section]; renderSidebar(); }

// ── Rating ──
function setRating(n) {
  currentRating = currentRating === n ? 0 : n;
  updateRatingDisplay();
}

function updateRatingDisplay() {
  const stars = document.querySelectorAll('#ratingInput .star-btn');
  stars.forEach((s, i) => { s.classList.toggle('filled', i < currentRating); });
}

// ── Representation system ──
function toggleRepSection(type) {
  const opts = document.getElementById('rep' + capitalize(type) + 'Options');
  const toggle = document.getElementById('rep' + capitalize(type) + 'Toggle');
  if (toggle.checked) {
    opts.classList.remove('hidden');
  } else {
    opts.classList.add('hidden');
    // Uncheck all sub-options when parent is unchecked
    opts.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
  }
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function getRepValues(type) {
  const toggle = document.getElementById('rep' + capitalize(type) + 'Toggle');
  if (!toggle.checked) return [];
  const checked = [];
  document.querySelectorAll('.rep-' + type + '-opt:checked').forEach(cb => checked.push(cb.value));
  return checked;
}

function setRepValues(type, values) {
  const toggle = document.getElementById('rep' + capitalize(type) + 'Toggle');
  const opts = document.getElementById('rep' + capitalize(type) + 'Options');
  if (values && values.length > 0) {
    toggle.checked = true;
    opts.classList.remove('hidden');
    document.querySelectorAll('.rep-' + type + '-opt').forEach(cb => {
      cb.checked = values.includes(cb.value);
    });
  } else {
    toggle.checked = false;
    opts.classList.add('hidden');
    document.querySelectorAll('.rep-' + type + '-opt').forEach(cb => cb.checked = false);
  }
}

function resetRep() {
  ['lgbtq', 'disability'].forEach(type => setRepValues(type, []));
}

// ── Add/Edit Modal ──
function openAddModal() {
  editingId = null;
  currentGenres = []; currentTags = []; currentThemes = []; currentRating = 0;
  clearFormError();
  document.getElementById('addModalTitle').textContent = 'Add Manga';
  document.getElementById('mangaTitle').value = '';
  document.getElementById('mangaAuthor').value = '';
  document.getElementById('mangaCover').value = '';
  document.getElementById('mangaSynopsis').value = '';
  document.getElementById('mangaVolumes').value = '';
  document.getElementById('mangaChapters').value = '';
  document.getElementById('mangaDemographic').value = '';
  document.getElementById('mangaPubStatus').value = 'unknown';
  document.getElementById('mangaReadingStatus').value = 'not-read';
  document.getElementById('mangaNotes').value = '';
  document.getElementById('lookupQuery').value = '';
  document.getElementById('lookupResults').innerHTML = '';
  resetRep();
  updateRatingDisplay();
  renderTagChips('genres'); renderTagChips('tags'); renderTagChips('themes');
  document.getElementById('addModal').classList.add('open');
}

function openEditModal(id) {
  const m = manga.find(x => x.id === id);
  if (!m) return;
  editingId = id;
  currentGenres = [...(m.genres || [])];
  currentTags = [...(m.tags || [])];
  currentThemes = [...(m.themes || [])];
  currentRating = m.rating || 0;
  clearFormError();
  document.getElementById('addModalTitle').textContent = 'Edit Manga';
  document.getElementById('mangaTitle').value = m.title || '';
  document.getElementById('mangaAuthor').value = m.author || '';
  document.getElementById('mangaCover').value = m.cover || '';
  document.getElementById('mangaSynopsis').value = m.synopsis || '';
  document.getElementById('mangaVolumes').value = m.volumes || '';
  document.getElementById('mangaChapters').value = m.chapters || '';
  document.getElementById('mangaDemographic').value = m.demographic || '';
  document.getElementById('mangaPubStatus').value = m.pubStatus || 'unknown';
  document.getElementById('mangaReadingStatus').value = m.readingStatus || 'not-read';
  document.getElementById('mangaNotes').value = m.notes || '';
  document.getElementById('lookupQuery').value = '';
  document.getElementById('lookupResults').innerHTML = '';
  setRepValues('lgbtq', m.lgbtq || []);
  setRepValues('disability', m.disability || []);
  updateRatingDisplay();
  renderTagChips('genres'); renderTagChips('tags'); renderTagChips('themes');
  document.getElementById('addModal').classList.add('open');
}

function closeAddModal() { document.getElementById('addModal').classList.remove('open'); editingId = null; }

function showFormError(msg) { const e = document.getElementById('formError'); e.textContent = msg; e.style.display = 'block'; }
function clearFormError() { const e = document.getElementById('formError'); e.textContent = ''; e.style.display = 'none'; }

function saveManga() {
  const title = document.getElementById('mangaTitle').value.trim();
  if (!title) { document.getElementById('mangaTitle').focus(); return; }

  const data = {
    title,
    author: document.getElementById('mangaAuthor').value.trim(),
    cover: document.getElementById('mangaCover').value.trim(),
    synopsis: document.getElementById('mangaSynopsis').value.trim(),
    volumes: document.getElementById('mangaVolumes').value.trim(),
    chapters: document.getElementById('mangaChapters').value.trim(),
    demographic: document.getElementById('mangaDemographic').value,
    pubStatus: document.getElementById('mangaPubStatus').value,
    readingStatus: document.getElementById('mangaReadingStatus').value,
    rating: currentRating,
    genres: [...currentGenres],
    tags: [...currentTags],
    themes: [...currentThemes],
    notes: document.getElementById('mangaNotes').value.trim(),
    lgbtq: getRepValues('lgbtq'),
    disability: getRepValues('disability'),
  };

  // Duplicate check
  if (!editingId) {
    const newTitle = data.title.toLowerCase();
    const dup = manga.find(m => m.title.toLowerCase() === newTitle);
    if (dup) { showFormError(`"${dup.title}" is already in your library.`); return; }
  }

  if (editingId) {
    const idx = manga.findIndex(m => m.id === editingId);
    if (idx > -1) {
      data.id = editingId;
      data.dateAdded = manga[idx].dateAdded;
      data.readStart = manga[idx].readStart || '';
      data.readFinish = manga[idx].readFinish || '';
      data.titleRomaji = manga[idx].titleRomaji || '';
      data.reread = manga[idx].reread || false;
      manga[idx] = data;
    }
  } else {
    data.id = genId();
    data.dateAdded = new Date().toISOString().split('T')[0];
    manga.push(data);
  }

  save(); closeAddModal(); renderManga();
  if (viewingId === editingId) openDetail(editingId);
}

// ── Tags / Genres input ──
function getList(type) { return type === 'genres' ? currentGenres : type === 'themes' ? currentThemes : currentTags; }
function setList(type, v) { if (type === 'genres') currentGenres = v; else if (type === 'themes') currentThemes = v; else currentTags = v; }

function renderTagChips(type) {
  const wrap = document.getElementById(type + 'Wrap');
  const input = document.getElementById(type + 'Input');
  wrap.querySelectorAll('.tag-chip').forEach(c => c.remove());
  getList(type).forEach((tag, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = `${escHtml(tag)} <button onclick="removeChip('${type}',${i})">&times;</button>`;
    wrap.insertBefore(chip, input);
  });
}

function normalizeTagCase(type, val) {
  // Find existing tag with same text (case-insensitive) and use that casing
  const field = type === 'genres' ? 'genres' : type === 'themes' ? 'themes' : 'tags';
  const lower = val.toLowerCase();
  for (const m of manga) {
    for (const t of (m[field] || [])) {
      if (t.toLowerCase() === lower) return t;
    }
  }
  return lower;
}

function handleTagKey(e, type) {
  if (e.key === 'Enter') {
    e.preventDefault();
    const raw = e.target.value.trim();
    if (!raw) return;
    const val = normalizeTagCase(type, raw);
    const list = getList(type);
    if (!list.some(t => t.toLowerCase() === val.toLowerCase())) { list.push(val); renderTagChips(type); }
    e.target.value = '';
    hideSuggestions(type);
  } else if (e.key === 'Backspace' && !e.target.value) {
    const list = getList(type);
    if (list.length) { list.pop(); renderTagChips(type); }
  } else if (e.key === 'Escape') { hideSuggestions(type); }
}

function getAllExisting(type) {
  const s = new Set();
  const field = type === 'genres' ? 'genres' : type === 'themes' ? 'themes' : 'tags';
  manga.forEach(m => (m[field] || []).forEach(t => s.add(t)));
  return [...s].sort();
}

function showTagSuggestions(type) {
  const input = document.getElementById(type + 'Input');
  const val = input.value.trim().toLowerCase();
  const container = document.getElementById(type + 'Suggestions');
  if (!val) { hideSuggestions(type); return; }
  const all = getAllExisting(type);
  const list = getList(type);
  const matches = all.filter(t => t.includes(val) && !list.includes(t));
  if (!matches.length) { hideSuggestions(type); return; }
  container.innerHTML = matches.map(t =>
    `<div class="tag-suggestion-item" onmousedown="selectSuggestion('${type}','${t.replace(/'/g, "\\'")}')">${escHtml(t)}</div>`
  ).join('');
  container.classList.add('open');
}

function selectSuggestion(type, val) {
  const list = getList(type);
  if (!list.includes(val)) { list.push(val); renderTagChips(type); }
  document.getElementById(type + 'Input').value = '';
  hideSuggestions(type);
  document.getElementById(type + 'Input').focus();
}

function hideSuggestions(type) { document.getElementById(type + 'Suggestions').classList.remove('open'); }
function removeChip(type, i) { getList(type).splice(i, 1); renderTagChips(type); }

// ── Tag/Genre Manager ──
function openTagManager(type) {
  tagManagerType = type;
  const titles = { genres: 'Edit Genres', tags: 'Edit Tags', themes: 'Edit Themes' };
  document.getElementById('tagManagerTitle').textContent = titles[type] || 'Edit Tags';
  renderTagManagerList();
  document.getElementById('tagManagerModal').classList.add('open');
}

function closeTagManager() { document.getElementById('tagManagerModal').classList.remove('open'); }

function renderTagManagerList() {
  const field = tagManagerType === 'genres' ? 'genres' : tagManagerType === 'themes' ? 'themes' : 'tags';
  const counts = {};
  manga.forEach(m => { (m[field] || []).forEach(t => { counts[t] = (counts[t] || 0) + 1; }); });
  const sorted = Object.keys(counts).sort((a, b) => a.localeCompare(b));
  const container = document.getElementById('tagManagerList');

  if (!sorted.length) { container.innerHTML = '<div style="color:var(--text-tertiary);font-size:0.8rem;">None yet.</div>'; return; }

  container.innerHTML = sorted.map(tag => {
    const safe = tag.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    return `<div class="tag-manager-row">
      <span class="tag-manager-name">${escHtml(tag)}</span>
      <span class="tag-manager-count">${counts[tag]}</span>
      <button class="tag-manager-btn rename" onclick="startRename('${safe}')">rename</button>
      <button class="tag-manager-btn delete" onclick="deleteTagItem('${safe}')">delete</button>
    </div>`;
  }).join('');
}

function startRename(oldTag) {
  const container = document.getElementById('tagManagerList');
  container.querySelectorAll('.tag-manager-row').forEach(row => {
    const name = row.querySelector('.tag-manager-name');
    if (name && name.textContent === oldTag) {
      const safe = oldTag.replace(/'/g, "\\'");
      row.innerHTML = `<input type="text" class="tag-manager-input" id="renameInput" value="${escHtml(oldTag)}" onkeydown="if(event.key==='Enter')confirmRename('${safe}');if(event.key==='Escape')renderTagManagerList();">
        <button class="tag-manager-btn save" onclick="confirmRename('${safe}')">save</button>
        <button class="tag-manager-btn cancel" onclick="renderTagManagerList()">cancel</button>`;
      document.getElementById('renameInput').focus();
      document.getElementById('renameInput').select();
    }
  });
}

function confirmRename(oldTag) {
  const input = document.getElementById('renameInput');
  const newTag = input.value.trim().toLowerCase();
  if (!newTag || newTag === oldTag) { renderTagManagerList(); return; }
  const field = tagManagerType === 'genres' ? 'genres' : tagManagerType === 'themes' ? 'themes' : 'tags';
  const existing = new Set();
  manga.forEach(m => (m[field] || []).forEach(t => existing.add(t)));

  manga.forEach(m => {
    if (m[field] && m[field].includes(oldTag)) {
      m[field] = m[field].filter(t => t !== oldTag);
      if (!m[field].includes(newTag)) m[field].push(newTag);
    }
  });

  save(); renderTagManagerList(); renderManga();
}

function deleteTagItem(tag) {
  if (!confirm(`Remove "${tag}" from all manga?`)) return;
  const field = tagManagerType === 'genres' ? 'genres' : tagManagerType === 'themes' ? 'themes' : 'tags';
  manga.forEach(m => { if (m[field]) m[field] = m[field].filter(t => t !== tag); });
  save();
  if (tagManagerType === 'genres' && currentGenre === tag) currentGenre = null;
  if (tagManagerType === 'tags' && currentTag === tag) currentTag = null;
  if (tagManagerType === 'themes' && currentThemeFilter === tag) currentThemeFilter = null;
  renderTagManagerList(); renderManga();
}

// ── Detail Modal ──
function openDetail(id) {
  const m = manga.find(x => x.id === id);
  if (!m) return;
  viewingId = id;
  const body = document.getElementById('detailBody');

  const coverHtml = m.cover
    ? `<img src="${escHtml(m.cover)}" alt="${escHtml(m.title)}">`

// Parse date field (supports "YYYY-MM", "Mon YYYY", or old "YYYY-MM-DD")
function parseDateField(val) {
  if (!val) return { month: null, year: null };
  // Try "YYYY-MM-DD" or "YYYY-MM"
  const isoMatch = val.match(/^(\d{4})-(\d{1,2})/);
  if (isoMatch) return { year: parseInt(isoMatch[1]), month: parseInt(isoMatch[2]) };
  // Try "Mon YYYY"
  const monthNames = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  const textMatch = val.match(/^([A-Za-z]+)\s+(\d{4})$/);
  if (textMatch) {
    const mi = monthNames.indexOf(textMatch[1].toLowerCase().slice(0,3));
    if (mi >= 0) return { year: parseInt(textMatch[2]), month: mi + 1 };
  }
  return { month: null, year: null };
}

function formatDateField(month, year) {
  if (!month && !year) return '';
  const monthNames = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  if (month && year) return `${monthNames[month]} ${year}`;
  if (year) return `${year}`;
  return '';
}

// Save reading date month/year from detail modal
function saveDetailMonthYear(id, field, part, value) {
  const m = manga.find(x => x.id === id);
  if (!m) return;
  const parsed = parseDateField(m[field]);
  if (part === 'month') parsed.month = value ? parseInt(value) : null;
  if (part === 'year') parsed.year = value ? parseInt(value) : null;
  m[field] = formatDateField(parsed.month, parsed.year);
  save();
}

// Alphabet bar
function renderAlphaBar() {
  const bar = document.getElementById('alphaBar');
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  // Count which letters have manga
  const available = new Set();
  let hasNonAlpha = false;
  manga.forEach(m => {
    const first = (m.title || '')[0]?.toUpperCase();
    if (first && first >= 'A' && first <= 'Z') available.add(first);
    else hasNonAlpha = true;
  });

  let html = `<button class="${!currentAlphaFilter ? '' : 'active'}" onclick="clearFilters();renderManga();" style="${!currentAlphaFilter ? 'color:var(--text);font-weight:600;' : ''}">All</button>`;
  letters.forEach(l => {
    const has = available.has(l);
    const active = currentAlphaFilter === l ? ' active' : '';
    const disabled = !has ? ' disabled' : '';
    html += `<button class="${active}${disabled}" onclick="${has ? `toggleAlpha('${l}')` : ''}">${l}</button>`;
  });
  if (hasNonAlpha) {
    const active = currentAlphaFilter === '#' ? ' active' : '';
    html += `<button class="${active}" onclick="toggleAlpha('#')">#</button>`;
  }
  bar.innerHTML = html;
}

function exportLibrary() {

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = `manga-library-${new Date().toISOString().split('T')[0]}.json`;
  a.click(); URL.revokeObjectURL(url);
}

function importLibrary(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);
      if (!Array.isArray(imported)) throw new Error('Invalid');
      const ids = new Set(manga.map(m => m.id));
      let added = 0;
      imported.forEach(m => { if (!ids.has(m.id)) { manga.push(m); added++; } });
      save(); renderManga();
      alert(`Imported ${added} new title${added !== 1 ? 's' : ''}. ${imported.length - added} already in library.`);
    } catch(err) { alert('Could not read that file.'); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

let autopopRunning = false;

function cleanSearchTitle(title) {
  // Remove everything after underscore (alternative titles)
  let t = title.split('_')[0].trim();
  // Remove parenthetical notes
  t = t.replace(/\s*\(.*?\)\s*$/g, '').trim();
  return t;
}

async function anilistSearch(searchTitle) {
  const gql = `query ($search: String) {
    Page(page: 1, perPage: 3) {
      media(search: $search, type: MANGA, sort: [SEARCH_MATCH, POPULARITY_DESC]) {
        title { romaji english }
        coverImage { large }
        description(asHtml: false)
        staff(sort: RELEVANCE, perPage: 5) { edges { role node { name { full } } } }
        genres
        volumes
        chapters
        status
        tags { name category rank isMediaSpoiler }
      }
    }
  }`;
  const res = await fetch('https://graphql.anilist.co', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify({ query: gql, variables: { search: searchTitle } })
  });
  if (res.status === 429) {
    // Rate limited — wait 60s then retry
    await new Promise(r => setTimeout(r, 60000));
    return anilistSearch(searchTitle);
  }
  if (!res.ok) return null;
  const json = await res.json();
  const results = json.data?.Page?.media;
  return results && results.length > 0 ? results[0] : null;
}

function mapAnilistStatus(s) {
  const m = { FINISHED: 'finished', RELEASING: 'ongoing', HIATUS: 'hiatus', CANCELLED: 'cancelled', NOT_YET_RELEASED: 'ongoing' };
  return m[s] || 'unknown';
}

function cleanSynopsis(desc) {
  if (!desc) return '';
  let t = desc.replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim();
  if (t.length > 400) t = t.slice(0, 397) + '…';
  return t;
}

function getStaffAuthors(edges) {
  const authors = [];
  for (const e of (edges || [])) {
    const role = (e.role || '').toLowerCase();
    if (role.includes('story') || role.includes('art') || role.includes('original') || role.includes('creator')) {
      const name = e.node?.name?.full;
      if (name && !authors.includes(name)) authors.push(name);
    }
  }
  return authors;
}

function extractDemographic(tags) {
  const demoTag = (tags || []).find(t => (t.category || '').toLowerCase() === 'demographic' && !t.isMediaSpoiler);
  if (!demoTag) return '';
  let d = demoTag.name.toLowerCase();
  if (d === 'shonen') d = 'shounen';
  if (d === 'shojo') d = 'shoujo';
  return d;
}

async function startAutoPopulate() {
  // Normalize any legacy publicationStatus → pubStatus before starting
  manga.forEach(m => {
    if (m.publicationStatus && !m.pubStatus) {
      m.pubStatus = m.publicationStatus;
    }
    if (m.publicationStatus) delete m.publicationStatus;
    if (!m.pubStatus) m.pubStatus = 'unknown';
  });

  // Process ALL manga entries
  const entries = [...manga];
  if (entries.length === 0) {
    alert('Your library is empty!');
    return;
  }

  autopopRunning = true;
  document.getElementById('autopopOverlay').classList.add('open');
  document.getElementById('autopopTitle').textContent = 'Syncing with AniList…';
  document.getElementById('autopopStopBtn').style.display = '';
  document.getElementById('autopopDoneBtn').style.display = 'none';
  document.getElementById('autopopBar').style.width = '0%';

  let done = 0;
  let updated = 0;
  const total = entries.length;
  let saveCounter = 0;

  for (const entry of entries) {
    if (!autopopRunning) break;

    const searchTitle = cleanSearchTitle(entry.title);
    document.getElementById('autopopStatus').textContent = searchTitle;
    document.getElementById('autopopProgress').textContent = `${done} / ${total}`;
    document.getElementById('autopopFound').textContent = `${updated} updated`;

    try {
      const result = await anilistSearch(searchTitle);
      if (result) {
        let changed = false;

        // Cover — only fill if missing
        const cover = result.coverImage?.large || '';
        if (cover && !entry.cover) { entry.cover = cover; changed = true; }

        // Synopsis — only fill if missing
        const synopsis = cleanSynopsis(result.description);
        if (synopsis && !entry.synopsis) { entry.synopsis = synopsis; changed = true; }

        // Author — only fill if missing
        const authors = getStaffAuthors(result.staff?.edges);
        if (authors.length && !entry.author) { entry.author = authors.join(', '); changed = true; }

        // Genres — only fill if missing
        const genres = (result.genres || []).map(g => g.toLowerCase());
        if (genres.length && (!entry.genres || !entry.genres.length)) { entry.genres = genres; changed = true; }

        // Volumes — only fill if missing
        if (result.volumes && !entry.volumes) { entry.volumes = String(result.volumes); changed = true; }

        // Chapters — only fill if missing
        if (result.chapters && !entry.chapters) { entry.chapters = String(result.chapters); changed = true; }

        // Publication status — ALWAYS update from AniList
        const apiStatus = mapAnilistStatus(result.status);
        if (apiStatus !== 'unknown' && entry.pubStatus !== apiStatus) {
          entry.pubStatus = apiStatus;
          changed = true;
        }

        // Demographic — ALWAYS update from AniList (overwrite if API has it)
        const apiDemo = extractDemographic(result.tags);
        if (apiDemo && entry.demographic !== apiDemo) {
          entry.demographic = apiDemo;
          changed = true;
        }

        // Romaji title — ALWAYS update from AniList
        const apiRomaji = result.title?.romaji || '';
        if (apiRomaji && entry.titleRomaji !== apiRomaji) {
          entry.titleRomaji = apiRomaji;
          changed = true;
        }

        if (changed) updated++;
      }
    } catch (err) {
      // Skip on error, continue with next
    }

    done++;
    document.getElementById('autopopBar').style.width = `${Math.round((done / total) * 100)}%`;

    // Save to GitHub every 20 entries
    saveCounter++;
    if (saveCounter >= 20) {
      saveCounter = 0;
      document.getElementById('autopopStatus').textContent = 'Saving progress…';
      try { await saveToGitHub(); } catch(e) {}
    }

    // Rate limit: AniList allows 90 req/min, so ~700ms between requests
    await new Promise(r => setTimeout(r, 700));
  }

  // Final save
  document.getElementById('autopopStatus').textContent = 'Saving…';
  try { await saveToGitHub(); } catch(e) {}

  document.getElementById('autopopTitle').textContent = autopopRunning ? 'Done!' : 'Stopped';
  document.getElementById('autopopStatus').textContent = `${updated} manga updated.`;
  document.getElementById('autopopProgress').textContent = `${done} / ${total}`;
  document.getElementById('autopopFound').textContent = `${updated} updated`;
  document.getElementById('autopopBar').style.width = `${Math.round((done / total) * 100)}%`;
  document.getElementById('autopopStopBtn').style.display = 'none';
  document.getElementById('autopopDoneBtn').style.display = '';
  autopopRunning = false;
  renderManga();
}

function stopAutoPopulate() { autopopRunning = false; }

function closeAutoPopulate() {
  document.getElementById('autopopOverlay').classList.remove('open');
  renderManga();
}

// ── Init ──
async function init() {
  if (loadConfig()) {
    try {
      showIndicator('loading library…');
      await loadFromGitHub();
      hideIndicator();
      renderManga();
    } catch(e) {
      hideIndicator();
      openSetupModal();
    }
  } else {
    openSetupModal();
  }
  setReadingFilter('all');
}

init();
</script>
